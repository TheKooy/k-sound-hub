name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip rsync

      - name: Build release archives
        run: ./scripts/package_release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/k-sounds-hub-linux-release-$GITHUB_REF_NAME.tar.gz \
            dist/k-sounds-hub-linux-release-$GITHUB_REF_NAME.zip \
            dist/SHA256SUMS.txt \
            --title "K-Sounds Hub $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
